<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarvis — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 32px 30px;
    width: 100%;
    max-width: 320px;
  }
  .login-card .brand { margin-bottom: 18px; }
  .login-card p { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; }
  .login-card input {
    width: 100%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 13.5px;
    margin-bottom: 12px;
  }
  .login-card input:focus { outline: 1px solid var(--accent); }
  .login-card button {
    width: 100%;
    background: var(--accent);
    color: #1a1408;
    border: none;
    padding: 10px;
    border-radius: 4px;
    font-family: var(--font-display);
    font-weight: 600;
    cursor: pointer;
  }
  .login-card button:hover { opacity: 0.9; }
  .login-error { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">JARVIS</span>
    </div>
    <p>Enter the password to reach the desk.</p>
    <form id="login-form">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus />
      <button type="submit">Sign in</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/';
      } else {
        errEl.textContent = data.error || 'Login failed';
      }
    } catch (err) {
      errEl.textContent = 'Connection error';
    }
  });
</script>
</body>
</html>
