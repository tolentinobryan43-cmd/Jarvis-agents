<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<canvas id="globe" class="login-bg"></canvas>
<div class="sweep"></div>
<div class="vignette"></div>

<div class="boot">
  <div class="boot-card">

    <div class="brand">
      <svg width="20" height="22" viewBox="0 0 17 19" fill="none" aria-hidden="true">
        <path d="M8.5 1 16 5.25v8.5L8.5 18 1 13.75v-8.5L8.5 1Z" stroke="#a8dcff" stroke-width="1"/>
        <path d="M8.5 4.6 13.2 7.3v5.4L8.5 15.4 3.8 12.7V7.3L8.5 4.6Z" stroke="#a8dcff" stroke-width=".7" stroke-opacity=".6"/>
        <circle cx="8.5" cy="10" r="2.1" fill="#a8dcff"/>
      </svg>
      <span>JARVIS</span>
    </div>

    <p>Authorization required</p>

    <form id="login-form">
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" autofocus />
      <button type="submit">Authenticate</button>
    </form>

    <div class="boot-err" id="login-error"></div>

  </div>
</div>

<script src="/globe.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/';
      } else {
        errEl.textContent = data.error || 'Access denied';
      }
    } catch (err) {
      errEl.textContent = 'Connection error';
    }
  });
</script>
</body>
</html>
